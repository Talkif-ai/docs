# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: openapi.json
      overlays: overlays.yml

# SDKs are generated from the same curated public spec as the API reference.
# Fern opens a pull request in each SDK repo; a human reviews + merges, and a
# vX.Y.Z tag there publishes to the registry (see the repo's CLAUDE.md).
# Requires the Fern GitHub app on Talkif-ai/talkif-typescript + talkif-python.
groups:
  ts-sdk:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.92.0
        output:
          location: npm
          package-name: "@talkif/sdk"
          token: OIDC
        github:
          repository: Talkif-ai/talkif-typescript
          mode: pull-request
        config:
          namespaceExport: Talkif
          offsetSemantics: item-index
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.30.0
        # No registry output here: the repo's tag-driven workflow publishes to
        # PyPI via trusted publishing (OIDC). Fern only opens the code PR.
        github:
          repository: Talkif-ai/talkif-python
          mode: pull-request
        config:
          client:
            class_name: Talkif
          package_name: talkif
          offset_semantics: item-index
