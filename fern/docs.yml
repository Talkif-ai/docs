# Talkif docs — Fern site configuration.
# Reference: https://buildwithfern.com/learn/docs/configuration/site-level-settings
instances:
  - url: talkif.docs.buildwithfern.com
    custom-domain: docs.talkif.ai
    edit-this-page:
      github:
        owner: Talkif-ai
        repo: docs
        branch: main

title: Talkif Docs
favicon: docs/assets/favicon.svg

# Same mark + wordmark as the shared Navbar; docs blue accent (each public
# site keeps its own accent: landing coral, docs blue, status green, trust slate).
logo:
  light: docs/assets/logo-light.svg
  dark: docs/assets/logo-dark.svg
  height: 24
  href: https://talkif.ai

# Light accent darkened from the shared token #1570D1 to #0F54A0 so it clears Fern's 7:1
# (WCAG AAA) contrast check on the light background; otherwise Fern substitutes its own.
# Hex values converted from the oklch tokens in packages/ui/src/globals.css
# and apps/docs/app/globals.css (--emphasis / --background / --border).
colors:
  accent-primary:
    light: "#0F54A0"
    dark: "#5FA7FF"
  background:
    light: "#F5F8FF"
    dark: "#12151A"
  border:
    light: "#D4D7E0"
    dark: "#2C2E32"

# Inter + JetBrains Mono, matching the landing. Variable fonts, OFL (licenses
# alongside the files).
typography:
  bodyFont:
    name: Inter
    paths:
      - path: docs/fonts/inter-latin-wght-normal.woff2
        weight: 100 900
        style: normal
  headingsFont:
    name: Inter
    paths:
      - path: docs/fonts/inter-latin-wght-normal.woff2
        weight: 100 900
        style: normal
  codeFont:
    name: JetBrains Mono
    paths:
      - path: docs/fonts/jetbrains-mono-latin-wght-normal.woff2
        weight: 100 800
        style: normal

# Use the whole viewport; keep prose at a readable measure, left-aligned to the sidebar.
layout:
  page-width: full
  content-width: 60rem
  content-alignment: left
  tabs-placement: header

navbar-links:
  - type: minimal
    text: Trust
    href: https://trust.talkif.ai
  - type: minimal
    text: Status
    href: https://status.talkif.ai
  - type: filled
    text: Open App
    href: https://app.talkif.ai

