# OpenAPI overlay applied on top of openapi.json at docs + SDK build time.
# Keeps docs/SDK-only concerns out of the backend-generated spec.
# Spec: https://spec.openapis.org/overlay/v1.0.0.html
overlay: 1.0.0
info:
  title: Talkif public API reference adjustments
  version: 1.0.0
actions:
  # The backend spec ships without a servers block, so every example
  # renders a relative path. Pin the public production host.
  - target: $
    update:
      servers:
        - url: https://api.talkif.ai
          x-fern-server-name: Production

  # ── SDK ergonomics ────────────────────────────────────────────────────────
  # Offset pagination on the list endpoints that return { <items>[], meta }.
  # step advances offset by the page size; enables auto-paging iterators.

  - target: $.paths["/api/v1/campaigns"].get
    update:
      x-fern-pagination:
        offset: $request.offset
        step: $request.limit
        results: $response.campaigns

  - target: $.paths["/api/v1/campaigns/{campaignId}/contacts"].get
    update:
      x-fern-pagination:
        offset: $request.offset
        step: $request.limit
        results: $response.contacts

  - target: $.paths["/api/v1/contacts"].get
    update:
      x-fern-pagination:
        offset: $request.offset
        step: $request.limit
        results: $response.contacts

  - target: $.paths["/api/v1/contacts/{contactId}/calls"].get
    update:
      x-fern-pagination:
        offset: $request.offset
        step: $request.limit
        results: $response.calls

  - target: $.paths["/api/v1/dnc"].get
    update:
      x-fern-pagination:
        offset: $request.offset
        step: $request.limit
        results: $response.entries

  - target: $.paths["/api/v1/schedules"].get
    update:
      x-fern-pagination:
        offset: $request.offset
        step: $request.limit
        results: $response.schedules

  # ── Offset start fix ─────────────────────────────────────────────────────
  # The Fern generators only honour `default` on plain integers; on int64 they
  # fall back to a starting offset of 1, so auto-paging skips the first item.
  # Offsets are int64 upstream; present them as int32 here so `default: 0` is
  # used. TODO(upstream API): make list offsets u32 and delete this block.

  - target: $.paths["/api/v1/campaigns"].get.parameters[3].schema
    update:
      format: int32
      default: 0
      minimum: 0

  - target: $.paths["/api/v1/campaigns/{campaignId}/contacts"].get.parameters[4].schema
    update:
      format: int32
      default: 0
      minimum: 0

  - target: $.paths["/api/v1/contacts"].get.parameters[1].schema
    update:
      format: int32
      default: 0
      minimum: 0

  - target: $.paths["/api/v1/contacts/{contactId}/calls"].get.parameters[2].schema
    update:
      format: int32
      default: 0
      minimum: 0

  - target: $.paths["/api/v1/dnc"].get.parameters[1].schema
    update:
      format: int32
      default: 0
      minimum: 0

  - target: $.paths["/api/v1/schedules"].get.parameters[2].schema
    update:
      format: int32
      default: 0
      minimum: 0

  # ── Call history / active calls ──────────────────────────────────────────
  # Enable auto-paging like the other lists. limit/offset are optional
  # upstream now, and call history's offset is already int32 with default 0.
  # Active calls' offset is still int64, so it gets the same offset start fix
  # as the lists above (otherwise the pager skips the first live call).
  - target: $.paths["/api/v1/calls/history"].get
    update:
      x-fern-pagination:
        offset: $request.offset
        step: $request.limit
        results: $response.calls
  - target: $.paths["/api/v1/calls/active"].get
    update:
      x-fern-pagination:
        offset: $request.offset
        step: $request.limit
        results: $response.calls
  - target: $.paths["/api/v1/calls/active"].get.parameters[1].schema
    update:
      format: int32
      default: 0
      minimum: 0

  # ── Duplicate operationId ────────────────────────────────────────────────
  # POST /calls/{callId}/end and POST /public/calls/{callId}/end share the
  # operationId `end_call`, so both would generate a request type named
  # EndCallRequest and `fern check` fails. The public one already ships under
  # that name in the TypeScript SDK (Talkif.EndCallRequest); name the new one
  # differently.
  # TODO(upstream API): give every operation a unique operationId (also
  # `get_ice_servers`, used by /calls/webrtc/ice-servers and
  # /public/calls/ice-servers), then delete this block.
  - target: $.paths["/api/v1/calls/{callId}/end"].post
    update:
      x-fern-request-name: EndActiveCallRequest
